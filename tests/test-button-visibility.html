<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Visibility Test</title>
    <style>
        body {
            background: linear-gradient(135deg, #4518ac 0%, #3214a0 25%, #2a1185 50%, #1f0d6b 75%, #150a4d 100%);
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        .test-card {
            background: #1e1e2e;
            border-radius: 12px;
            overflow: hidden;
            width: 220px;
            height: 380px;
            display: flex;
            flex-direction: column;
            border: 2px solid #00ff88;
        }
        
        .test-image {
            width: 100%;
            height: 240px;
            background: #2a2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }
        
        .test-info {
            height: 140px;
            padding: 12px;
            background: #1e1e2e;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid red;
        }
        
        .test-content {
            flex: 1;
            border: 1px solid yellow;
        }
        
        .test-button {
            width: 100%;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            height: 32px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .debug-info {
            color: white;
            margin: 20px 0;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <h3>Button Visibility Test</h3>
        <p>Card height: 380px</p>
        <p>Image height: 240px</p>
        <p>Info height: 140px</p>
        <p>Button height: 32px</p>
        <p>Info padding: 12px (top/bottom = 24px total)</p>
        <p>Available space for content: 140px - 24px - 32px = 84px</p>
    </div>
    
    <div class="test-card">
        <div class="test-image">
            IMAGE AREA (240px)
        </div>
        <div class="test-info">
            <div class="test-content">
                <div style="color: white; font-size: 13px; margin-bottom: 6px;">FIFA 23</div>
                <div style="color: #b0b0b0; font-size: 9px; margin-bottom: 6px;">PC • GLOBAL</div>
                <div style="color: #00ff88; font-size: 16px; margin-bottom: 6px;">€59.99</div>
                <div style="color: #ffc107; font-size: 10px;">★★★★☆ 4.5</div>
            </div>
            <button class="test-button">ADD TO CART</button>
        </div>
    </div>
</body>
</html>
